<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hydra Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #123047, #080d18 65%);
            color: white;
        }

        header {
            background: #111827;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #263244;
        }

        header h1 {
            margin: 0;
            color: #00ffcc;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .profile-card {
            background: #101827;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #00ffcc44;
            box-shadow: 0 0 25px #00ffcc22;
        }

        .profile-card h2 {
            text-align: center;
            color: #00ffcc;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .profile-item {
            background: #1f2937;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .profile-item strong {
            color: #00ffcc;
        }

        .profile-item span {
            color: #ffffff;
            overflow-wrap: anywhere;
        }

        .role-admin {
            color: #ffd166 !important;
            font-weight: bold;
        }

        .role-user {
            color: #00ff99 !important;
            font-weight: bold;
        }

        .loading {
            color: #ffd166;
            text-align: center;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
        }

        button,
        .home-link {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #00ffcc;
            color: #080d18;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover,
        .home-link:hover {
            background: white;
            transform: translateY(-2px);
        }

        .logout-button {
            background: #ff6b6b;
            color: #180808;
        }

        .logout-button:hover {
            background: #ffaaaa;
        }

        .back-link {
            background: #263244;
            color: white;
        }

        .back-link:hover {
            background: #34445b;
        }
    </style>
</head>

<body>

    <header>
        <h1>HYDRA PROFILE</h1>
    </header>

    <div class="container">

        <div class="profile-card">

            <h2>User Profile</h2>

            <p id="message" class="loading">
                Loading profile...
            </p>

            <div id="profileData" style="display: none;">

                <div class="profile-item">
                    <strong>User ID:</strong>
                    <span id="userId"></span>
                </div>

                <div class="profile-item">
                    <strong>Username:</strong>
                    <span id="username"></span>
                </div>

                <div class="profile-item">
                    <strong>Email:</strong>
                    <span id="email"></span>
                </div>

                <div class="profile-item">
                    <strong>Role:</strong>
                    <span id="role"></span>
                </div>

            </div>

            <button onclick="loadProfile()">
                Refresh Profile
            </button>

            <button
                class="logout-button"
                onclick="logout()">
                Logout
            </button>

            <a
                class="home-link back-link"
                href="dashboard.html">
                Back to Dashboard
            </a>

        </div>

    </div>

    <script>
        async function loadProfile() {

            const message =
                document.getElementById("message");

            const profileData =
                document.getElementById("profileData");

            const roleElement =
                document.getElementById("role");

            const loggedInUsername =
                localStorage.getItem("hydraUsername");

            if (!loggedInUsername) {

                profileData.style.display = "none";
                message.style.display = "block";
                message.className = "error";

                message.textContent =
                    "No logged-in user found. Please login first.";

                return;
            }

            message.style.display = "block";
            message.className = "loading";
            message.textContent = "Loading profile...";

            profileData.style.display = "none";

            try {

                const response =
                    await fetch("/api/users");

                if (!response.ok) {
                    throw new Error(
                        "Unable to load users from backend."
                    );
                }

                const users =
                    await response.json();

                const user =
                    users.find(function(currentUser) {

                        return currentUser.username ===
                            loggedInUsername;

                    });

                if (!user) {
                    throw new Error(
                        "Logged-in user was not found."
                    );
                }

                document.getElementById("userId")
                    .textContent = user.id;

                document.getElementById("username")
                    .textContent = user.username;

                document.getElementById("email")
                    .textContent = user.email;

                roleElement.textContent = user.role;

                if (user.role === "ADMIN") {

                    roleElement.className =
                        "role-admin";

                } else {

                    roleElement.className =
                        "role-user";
                }

                message.style.display = "none";
                profileData.style.display = "block";

            } catch (error) {

                profileData.style.display = "none";
                message.style.display = "block";
                message.className = "error";

                message.textContent =
                    "Error loading profile: " +
                    error.message;
            }
        }

        function logout() {

            localStorage.removeItem("hydraUsername");

            window.location.href = "login.html";
        }

        loadProfile();
    </script>

</body>
</html>
