<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Register</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080d18;
            color: white;
        }

        .container {
            width: 350px;
            padding: 30px;
            background: #101827;
            border-radius: 12px;
            box-shadow: 0 0 20px #00ffcc55;
        }

        h1 {
            text-align: center;
            color: #00ffcc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #00ffcc;
            color: #080d18;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        p {
            text-align: center;
        }

        a {
            color: #00ffcc;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>HYDRA REGISTER</h1>

        <form id="registerForm">
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Register</button>
        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p>
            <a href="index.html">Back to Home</a>
        </p>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const result = await response.text();

                document.getElementById("message").textContent = result;
            } catch (error) {
                document.getElementById("message").textContent =
                    "Unable to connect to Hydra backend.";
            }
        });
    </script>

</body>
</html>
