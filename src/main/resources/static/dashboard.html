<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hydra Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #123047, #080d18 65%);
            color: white;
        }

        header {
            background: #101827;
            padding: 20px 6%;
            border-bottom: 1px solid #00ffcc44;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            color: #00ffcc;
            letter-spacing: 2px;
        }

        .header-user {
            color: #aab7c4;
        }

        .header-user span {
            color: #00ffcc;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .welcome-card {
            background: #101827;
            border: 1px solid #00ffcc44;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 25px #00ffcc18;
            margin-bottom: 25px;
        }

        .welcome-card h2 {
            margin-top: 0;
            color: #00ffcc;
        }

        .welcome-card p {
            color: #aab7c4;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #101827;
            border: 1px solid #263244;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .stat-card h3 {
            color: #aab7c4;
            margin-top: 0;
            font-size: 16px;
        }

        .stat-card .number {
            font-size: 38px;
            font-weight: bold;
            color: #00ffcc;
        }

        .users-section {
            background: #101827;
            border: 1px solid #263244;
            border-radius: 15px;
            padding: 25px;
            overflow-x: auto;
        }

        .users-section h2 {
            color: #00ffcc;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 600px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #263244;
            text-align: left;
        }

        th {
            background: #1f2937;
            color: #00ffcc;
        }

        tr:hover {
            background: #1a2333;
        }

        .role-admin {
            color: #ffd166;
            font-weight: bold;
        }

        .role-user {
            color: #00ff99;
            font-weight: bold;
        }

        .loading {
            color: #ffd166;
        }

        .error {
            color: #ff6b6b;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button,
        .link-button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background: #00ffcc;
            color: #080d18;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover,
        .link-button:hover {
            background: white;
            transform: translateY(-2px);
        }

        .logout-button {
            background: #ff6b6b;
            color: #180808;
        }

        .logout-button:hover {
            background: #ffaaaa;
        }

        .profile-button {
            background: #263244;
            color: white;
        }

        .profile-button:hover {
            background: #34445b;
        }

        @media (max-width: 700px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }

            .container {
                width: 92%;
            }

            .welcome-card,
            .users-section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>HYDRA DASHBOARD</h1>

        <div class="header-user">
            Logged in as:
            <span id="headerUsername">Guest</span>
        </div>

    </header>

    <main class="container">

        <section class="welcome-card">

            <h2>
                Welcome,
                <span id="welcomeUsername">Security Explorer</span>
                🚀
            </h2>

            <p>
                Welcome to Hydra Cybersecurity Platform.
                Your backend and MySQL database are connected successfully.
            </p>

            <div class="buttons">

                <a
                    class="link-button profile-button"
                    href="profile.html">
                    View Profile
                </a>

                <button
                    class="logout-button"
                    onclick="logout()">
                    Logout
                </button>

            </div>

        </section>

        <section class="stats-grid">

            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>

            <div class="stat-card">
                <h3>Admin Users</h3>
                <div class="number" id="totalAdmins">0</div>
            </div>

            <div class="stat-card">
                <h3>Normal Users</h3>
                <div class="number" id="totalNormalUsers">0</div>
            </div>

        </section>

        <section class="users-section">

            <h2>Registered Users</h2>

            <p id="message" class="loading">
                Loading users...
            </p>

            <table id="usersTable" style="display: none;">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                </thead>

                <tbody id="usersBody"></tbody>

            </table>

            <button onclick="loadUsers()">
                Refresh Users
            </button>

        </section>

    </main>

    <script>
        const loggedInUsername =
            localStorage.getItem("hydraUsername");

        if (!loggedInUsername) {

            window.location.href = "login.html";

        } else {

            document.getElementById("headerUsername")
                .textContent = loggedInUsername;

            document.getElementById("welcomeUsername")
                .textContent = loggedInUsername;
        }

        async function loadUsers() {

            const message =
                document.getElementById("message");

            const table =
                document.getElementById("usersTable");

            const usersBody =
                document.getElementById("usersBody");

            message.className = "loading";
            message.textContent = "Loading users...";

            table.style.display = "none";
            usersBody.innerHTML = "";

            try {

                const response =
                    await fetch("/api/users");

                if (!response.ok) {
                    throw new Error(
                        "Unable to load users from backend."
                    );
                }

                const users =
                    await response.json();

                let adminCount = 0;
                let normalUserCount = 0;

                users.forEach(function(user) {

                    if (user.role === "ADMIN") {
                        adminCount++;
                    } else {
                        normalUserCount++;
                    }

                    const row =
                        document.createElement("tr");

                    const roleClass =
                        user.role === "ADMIN"
                            ? "role-admin"
                            : "role-user";

                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td class="${roleClass}">
                            ${user.role}
                        </td>
                    `;

                    usersBody.appendChild(row);

                });

                document.getElementById("totalUsers")
                    .textContent = users.length;

                document.getElementById("totalAdmins")
                    .textContent = adminCount;

                document.getElementById("totalNormalUsers")
                    .textContent = normalUserCount;

                if (users.length === 0) {

                    message.textContent =
                        "No users found.";

                    return;
                }

                message.textContent =
                    "Users loaded successfully: " +
                    users.length;

                table.style.display = "table";

            } catch (error) {

                message.className = "error";

                message.textContent =
                    "Error loading users: " +
                    error.message;
            }
        }

        function logout() {

            localStorage.removeItem("hydraUsername");

            window.location.href = "login.html";
        }

        loadUsers();
    </script>

</body>
</html>
